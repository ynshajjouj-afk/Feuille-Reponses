name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir buildsrc
          unzip -q Feuille-Reponses-APK-GitHub-v3.zip -d buildsrc
          cd buildsrc
          ls -la

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        working-directory: buildsrc
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Feuille-Reponses-APK-v3
          path: buildsrc/app/build/outputs/apk/debug/app-debug.apk
